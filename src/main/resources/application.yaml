spring:
  application:
    name: tpm-machine-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/machine_db}
    username: ${SPRING_DATASOURCE_USERNAME:machine_user}
    password: ${SPRING_DATASOURCE_PASSWORD:machine}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5673}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}


management:
  endpoints:
    web:
      exposure:
        include: health
