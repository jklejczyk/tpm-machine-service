services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: machine_db
      POSTGRES_USER: machine_user
      POSTGRES_PASSWORD: machine
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U machine_user -d machine_db"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/machine_db
      SPRING_DATASOURCE_USERNAME: machine_user
      SPRING_DATASOURCE_PASSWORD: machine
    ports: ["8081:8080"]
    depends_on:
      db:
        condition: service_healthy